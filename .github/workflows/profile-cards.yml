# Generates the images used in README.md and commits them to profile/.
# The public github-readme-stats instance is unreliable, so the cards are
# built here with the project's official action instead.
name: Update profile cards

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Navy palette: midnight background, ice text, royal-blue accents
      CARD_THEME: bg_color=0D1B33&title_color=5B8DEF&icon_color=8FB3FF&text_color=E6EEFF&ring_color=4169E1&border_radius=12&hide_border=true
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&${{ env.CARD_THEME }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&${{ env.CARD_THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake (navy edition)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-light&color_snake=#4169E1&color_dots=#EBEDF0,#D6E2F5,#A8BEDF,#5F7BA8,#1B2F5E
            profile/snake-dark.svg?palette=github-dark&color_snake=#4F7FFF&color_dots=#161B22,#16243D,#22385E,#34507F,#5A73A0

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: update profile cards" || exit 0
          git pull --rebase
          git push
