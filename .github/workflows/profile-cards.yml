# Generates the images used in README.md and commits them to profile/.
# The public github-readme-stats instance is unreliable, so the cards are
# built here with the project's official action instead.
name: Update profile cards

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Coffee palette: espresso background, latte text, caramel + Claude-orange accents
      CARD_THEME: bg_color=1E1915&title_color=D97757&icon_color=D4A373&text_color=E8DCCB&ring_color=D97757&border_radius=12&hide_border=true
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&${{ env.CARD_THEME }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&${{ env.CARD_THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake (coffee-bean edition)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-light&color_snake=#D97757&color_dots=#EBEDF0,#E6CCB2,#DDB892,#B08968,#7F5539
            profile/snake-dark.svg?palette=github-dark&color_snake=#D97757&color_dots=#161B22,#4A3428,#7F5539,#B08968,#DDB892

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: update profile cards" || exit 0
          git pull --rebase
          git push
